name: Renovar token de Instagram

# El token de Instagram caduca a los 60 días. Se renueva cada lunes y se guarda solo.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar y guardar el token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RESP=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_TOKEN}")
          NUEVO=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$NUEVO"
          gh secret set IG_TOKEN --repo "$REPO" --body "$NUEVO"
          echo "Token renovado. Caduca en $(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['expires_in']//86400)") días."
