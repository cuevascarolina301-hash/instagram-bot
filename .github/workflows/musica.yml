name: Añadir música a los Reels

# Se lanza solo cuando subes músicas a la carpeta musica/ (o a mano desde la pestaña Actions).
on:
  push:
    paths:
      - "musica/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escritura-repo
  cancel-in-progress: false

jobs:
  musica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Mezclar la música
        run: python3 poner_musica.py

      - name: Guardar los Reels con música
        run: |
          git config user.name "bot-publicador"
          git config user.email "bot@users.noreply.github.com"
          git add posts cola.json
          git diff --cached --quiet && exit 0
          git commit -m "Música añadida"
          git pull --rebase
          git push
