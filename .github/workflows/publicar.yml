name: Publicar en Instagram

on:
  schedule:
    # 4 Reels al día: 8:07, 12:07, 16:07 y 19:07 hora del Centro de EE. UU. (Chicago, Texas).
    # Hay dos horas UTC por cada publicación (una para el horario de verano y otra para el de invierno):
    # el paso «¿Toca publicar?» deja pasar solo la buena. Así el cambio de hora del 1 de noviembre
    # no mueve nada.
    - cron: "7 13 * * *"   # 8:07 verano
    - cron: "7 14 * * *"   # 8:07 invierno
    - cron: "7 17 * * *"   # 12:07 verano
    - cron: "7 18 * * *"   # 12:07 invierno
    - cron: "7 21 * * *"   # 16:07 verano
    - cron: "7 22 * * *"   # 16:07 invierno
    - cron: "7 0 * * *"    # 19:07 verano
    - cron: "7 1 * * *"    # 19:07 invierno
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prueba sin publicar (1 = sí, 0 = publicar de verdad)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: escritura-repo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: ¿Toca publicar?
        id: toca
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'EOF'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          cron = os.environ.get("CRON", "").strip()
          if not cron:                      # lanzado a mano
              ok = True
          else:
              h = int(cron.split()[1])      # hora UTC prevista
              now = datetime.now(timezone.utc)
              d = now.date()
              if now.hour < h:              # la ejecución salió con retraso y pasó la medianoche
                  d -= timedelta(days=1)
              prevista = datetime(d.year, d.month, d.day, h, 7, tzinfo=timezone.utc)
              local = prevista.astimezone(ZoneInfo("America/Chicago"))
              ok = local.hour in (8, 12, 16, 19)
              print(f"Prevista {prevista:%Y-%m-%d %H:%M} UTC = {local:%H:%M} en Chicago -> {'publicar' if ok else 'no toca'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ok={'true' if ok else 'false'}\n")
          EOF

      - uses: actions/checkout@v4
        if: steps.toca.outputs.ok == 'true'

      - name: Publicar el siguiente Reel
        if: steps.toca.outputs.ok == 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python3 publicar.py

      - name: Guardar el estado de la cola
        if: steps.toca.outputs.ok == 'true' && (github.event.inputs.dry_run || '0') != '1'
        run: |
          git config user.name "bot-publicador"
          git config user.email "bot@users.noreply.github.com"
          git add cola.json
          git diff --cached --quiet && exit 0
          git commit -m "Publicado: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
